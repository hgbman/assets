name: Verificar URLs de emuladores

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  check-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear script de verificacion
        run: |
          cat > check_urls.py << 'PYEOF'
          import json, urllib.request, urllib.error, os, sys
          BROKEN = []
          OK = []
          with open("emulators.json", encoding="utf-8") as f:
              data = json.load(f)
          token = os.environ.get("GH_TOKEN", "")
          headers = {"User-Agent": "HGB-URLChecker/1.0"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          entries = [(e["name"], e["url"]) for e in data if e.get("url", "")]
          print(f"Verificando {len(entries)} URLs...")
          for name, url in entries:
              try:
                  req = urllib.request.Request(url, method="HEAD", headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      code = resp.status
                      if code < 400:
                          print(f"  OK  [{code}] {name}")
                          OK.append((name, url, code))
                      else:
                          print(f"  ERR [{code}] {name} -> {url}")
                          BROKEN.append((name, url, code))
              except urllib.error.HTTPError as e:
                  print(f"  ERR [{e.code}] {name} -> {url}")
                  BROKEN.append((name, url, e.code))
              except Exception as e:
                  print(f"  ERR [---] {name} -> {url} ({e})")
                  BROKEN.append((name, url, str(e)))
          print(f"\nResultado: {len(OK)} OK, {len(BROKEN)} con problemas")
          with open("/tmp/broken_urls.txt", "w") as f:
              for name, url, code in BROKEN:
                  f.write(f"- {name}: [{code}] {url}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"broken_count={len(BROKEN)}\n")
          if BROKEN:
              sys.exit(1)
          PYEOF

      - name: Verificar URLs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 check_urls.py

      - name: Preparar cuerpo del email
        if: failure() && steps.check.outcome == 'failure'
        id: email_body
        run: |
          COUNT=$(wc -l < /tmp/broken_urls.txt | tr -d ' ')
          LISTA=$(cat /tmp/broken_urls.txt)
          echo "body<<EMAILEOF" >> "$GITHUB_OUTPUT"
          echo "Se detectaron URLs con problemas en el emulators.json." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "${COUNT} URL(s) fallaron:" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "${LISTA}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Log completo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "EMAILEOF" >> "$GITHUB_OUTPUT"

      - name: Enviar email
        if: failure() && steps.check.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "HGB - URLs de emuladores rotas (${{ github.run_id }})"
          to: millansoft@gmail.com
          from: "HGB Monitor <${{ secrets.MAIL_USERNAME }}>"
          body: ${{ steps.email_body.outputs.body }}

      - name: Resumen
        if: always()
        run: |
          echo "### Resultado de verificacion de URLs" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outcome }}" = "success" ]; then
            echo "Todas las URLs responden correctamente." >> $GITHUB_STEP_SUMMARY
          else
            echo "Hay URLs con problemas:" >> $GITHUB_STEP_SUMMARY
            cat /tmp/broken_urls.txt >> $GITHUB_STEP_SUMMARY
          fi
