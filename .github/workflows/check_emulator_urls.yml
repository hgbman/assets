name: Verificar URLs de emuladores

on:
  schedule:
    # 09:00 UTC = 06:00 Argentina (ART, UTC-3)
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Permite correrlo manualmente desde la pestaña Actions en cualquier momento

jobs:
  check-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar URLs del emulators.json
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json
          import urllib.request
          import urllib.error
          import os
          import sys

          EMULATORS_JSON = "emulators.json"
          TIMEOUT        = 20   # segundos por request
          BROKEN         = []
          OK             = []

          with open(EMULATORS_JSON, encoding="utf-8") as f:
              data = json.load(f)

          token = os.environ.get("GH_TOKEN", "")
          headers_base = {
              "User-Agent": "HGB-URLChecker/1.0",
          }
          if token:
              headers_base["Authorization"] = f"Bearer {token}"

          entries_with_url = [(e["name"], e["url"]) for e in data if e.get("url", "")]
          print(f"Verificando {len(entries_with_url)} URLs...\n")

          for name, url in entries_with_url:
              try:
                  req = urllib.request.Request(url, method="HEAD", headers=headers_base)
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                      code = resp.status
                      if code < 400:
                          print(f"  OK  [{code}] {name}")
                          OK.append((name, url, code))
                      else:
                          print(f"  ERR [{code}] {name}  →  {url}")
                          BROKEN.append((name, url, code))
              except urllib.error.HTTPError as e:
                  print(f"  ERR [{e.code}] {name}  →  {url}")
                  BROKEN.append((name, url, e.code))
              except Exception as e:
                  print(f"  ERR [---] {name}  →  {url}  ({e})")
                  BROKEN.append((name, url, str(e)))

          print(f"\nResultado: {len(OK)} OK, {len(BROKEN)} con problemas")

          # Escribir outputs para el paso siguiente
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"broken_count={len(BROKEN)}\n")

          if BROKEN:
              lines = []
              for name, url, code in BROKEN:
                  lines.append(f"- {name}: [{code}] {url}")
              body = "\n".join(lines)
              with open("/tmp/broken_urls.txt", "w") as f:
                  f.write(body)
              print("\n=== URLs con problemas ===")
              print(body)
              sys.exit(1)   # Marca el paso como fallido → activa la notificación
          PYEOF

      - name: Enviar email si hay URLs rotas
        if: failure() && steps.check.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ HGB — URLs de emuladores rotas (${{ github.run_id }})"
          to: millansoft@gmail.com
          from: "HGB Monitor <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Se detectaron URLs con problemas en el emulators.json.

            ${{ steps.check.outputs.broken_count }} URL(s) fallaron:

            $(cat /tmp/broken_urls.txt 2>/dev/null || echo "Ver log del workflow para detalles.")

            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/run/${{ github.run_id }}

      - name: Resumen en el workflow
        if: always()
        run: |
          echo "### Resultado de verificación de URLs" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outcome }}" = "success" ]; then
            echo "✅ Todas las URLs responden correctamente." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Hay URLs con problemas. Revisar el log o el email enviado a millansoft@gmail.com" >> $GITHUB_STEP_SUMMARY
          fi
