name: Verificar URLs de emuladores

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  check-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar URLs del emulators.json
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/workflows/check_urls.py

      - name: Preparar cuerpo del email
        if: failure() && steps.check.outcome == 'failure'
        id: email_body
        run: |
          BROKEN_LIST=$(cat /tmp/broken_urls.txt 2>/dev/null || echo "Ver log del workflow para detalles.")
          COUNT=$(grep -c "^-" /tmp/broken_urls.txt 2>/dev/null || echo "?")
          {
            echo "body<<EMAIL_BODY_EOF"
            echo "Se detectaron URLs con problemas en el emulators.json."
            echo ""
            echo "${COUNT} URL(s) fallaron:"
            echo ""
            echo "${BROKEN_LIST}"
            echo ""
            echo "Ver el log completo en:"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "EMAIL_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Enviar email si hay URLs rotas
        if: failure() && steps.check.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "HGB - URLs de emuladores rotas (${{ github.run_id }})"
          to: millansoft@gmail.com
          from: "HGB Monitor <${{ secrets.MAIL_USERNAME }}>"
          body: ${{ steps.email_body.outputs.body }}

      - name: Resumen en el workflow
        if: always()
        run: |
          echo "### Resultado de verificacion de URLs" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outcome }}" = "success" ]; then
            echo "Todas las URLs responden correctamente." >> $GITHUB_STEP_SUMMARY
          else
            echo "Hay URLs con problemas. Revisar el log o el email enviado a millansoft@gmail.com" >> $GITHUB_STEP_SUMMARY
            if [ -f /tmp/broken_urls.txt ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              cat /tmp/broken_urls.txt >> $GITHUB_STEP_SUMMARY
            fi
          fi
